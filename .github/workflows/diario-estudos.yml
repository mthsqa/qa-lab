name: Diario de estudos

on:
  schedule:
    # 12:00 em Brasília (UTC-3)
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: diario-estudos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  registrar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Registrar estudo do dia
        env:
          TZ: America/Sao_Paulo
        run: |
          set -euo pipefail
          TODAY="$(date +%F)"

          if git log --format="%ad" --date=format-local:%F | grep -Fxq "$TODAY"; then
            echo "Já existe commit em $TODAY. Nada a fazer."
            exit 0
          fi

          NOTES=(
            "Revisão da pirâmide: manter E2E só no caminho crítico."
            "Oráculo de teste: esperado vs obtido precisa ser observável."
            "Seletores: preferir data-testid, role e label."
            "Flake: tratar causa (animação, rede, massa), não só retry."
            "API: cobrir 401, 403, contrato e idempotência."
            "Smoke no PR; regressão maior em main/nightly."
            "Bug report: passos, esperado, obtido e evidência."
            "Exploratório: charter, tempobox e o que ficou de fora."
            "A11y rápido: teclado, foco visível e label no input."
            "Massa de teste: descartável, idempotente e identificável."
          )
          MSGS=(
            "docs: registrar estudo do dia"
            "docs: anotar pratica de testes"
            "docs: atualizar diario do laboratorio"
            "docs: registrar sessao de estudo"
            "docs: complementar notas de QA"
          )

          DAY_NUM="$(date +%j)"
          NOTE="${NOTES[$((10#$DAY_NUM % ${#NOTES[@]}))]}"
          MSG="${MSGS[$((10#$DAY_NUM % ${#MSGS[@]}))]}"

          {
            echo ""
            echo "## $TODAY"
            echo "$NOTE"
          } >> notes/diario.md

          git config user.name "mthsqa"
          git config user.email "matheus_jooe@hotmail.com"
          git add notes/diario.md
          git commit --author="mthsqa <matheus_jooe@hotmail.com>" -m "$MSG"
          git push
